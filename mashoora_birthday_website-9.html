<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Mashoora 💗</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Times New Roman',Times,serif}
body{
  background:linear-gradient(145deg,#ffd6e5 0%,#fff 52%,#ffeaf2 100%);
  color:#7d1641;
}
.page{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:0;pointer-events:none;transform:scale(.98);
  transition:opacity .65s ease,transform .65s ease;
}
.page.active{opacity:1;pointer-events:auto;transform:scale(1)}
.content{text-align:center;width:min(92vw,430px);position:relative;z-index:5}
h1{font-size:clamp(30px,9vw,48px);margin:0 0 12px;font-weight:800;text-shadow:0 3px 12px rgba(125,22,65,.28),0 0 18px rgba(255,105,160,.22)}
h2{font-size:clamp(24px,7vw,34px);margin:0 0 12px;text-shadow:0 3px 12px rgba(125,22,65,.28),0 0 18px rgba(255,105,160,.22)}
p{font-size:18px;line-height:1.5;margin:8px 0;text-shadow:0 2px 8px rgba(125,22,65,.16)}
.name{font-size:clamp(34px,10vw,50px);font-weight:900;margin-bottom:8px;text-shadow:0 4px 14px rgba(125,22,65,.3),0 0 22px rgba(255,80,145,.3)}
button{
  border:0;border-radius:999px;padding:15px 28px;margin-top:22px;
  font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,#e91e63,#ad1457);
  box-shadow:0 10px 25px rgba(190,30,90,.28);cursor:pointer;
}
button{font-family:'Times New Roman',Times,serif;text-shadow:0 2px 5px rgba(70,0,30,.35),0 0 10px rgba(255,255,255,.18)}
button:active{transform:scale(.96)}
.gift{
  width:145px;height:115px;margin:30px auto 26px;position:relative;
  filter:drop-shadow(0 18px 15px rgba(130,20,70,.18));
}
.box{position:absolute;left:12px;right:12px;bottom:0;height:82px;border-radius:8px;
  background:linear-gradient(135deg,#f2387b,#c2185b)}
.lid{position:absolute;left:4px;right:4px;top:19px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,#ff5b96,#d81b60)}
.ribbon-v{position:absolute;top:19px;bottom:0;left:58px;width:29px;background:#ffd54f}
.ribbon-h{position:absolute;left:12px;right:12px;top:49px;height:20px;background:#ffd54f}
.bow:before,.bow:after{content:"";position:absolute;width:43px;height:27px;top:0;
  background:#ffd54f;border-radius:50% 50% 45% 45%}
.bow:before{left:27px;transform:rotate(25deg)}.bow:after{right:27px;transform:rotate(-25deg)}
.float{position:absolute;font-size:28px;opacity:.72;animation:float 5s ease-in-out infinite;z-index:1}
.f1{left:8%;top:14%}.f2{right:9%;top:19%;animation-delay:1s}.f3{left:12%;bottom:18%;animation-delay:2s}
.f4{right:12%;bottom:12%;animation-delay:3s}.f5{left:47%;top:8%;animation-delay:1.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(8deg)}}

.scratch-wrap{margin:25px auto 12px;width:min(88vw,350px)}
.card{
  position:relative;height:210px;border-radius:22px;overflow:hidden;
  background:linear-gradient(145deg,#fff,#fff0f6);text-shadow:0 2px 8px rgba(125,22,65,.12);
  box-shadow:0 18px 45px rgba(140,20,70,.18);
  border:2px solid rgba(214,36,104,.12);
}
.prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.prize .emoji{font-size:45px}.prize strong{font-size:27px;color:#c2185b;margin:8px 0;text-shadow:0 3px 12px rgba(194,24,91,.3),0 0 16px rgba(255,100,160,.22)}
.prize span{font-size:16px;color:#8a3457}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hint{font-size:15px!important;color:#a04468!important}
.small{font-size:13px!important;color:#9a5b76!important}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20;display:none}
.confetti i{position:absolute;width:8px;height:14px;border-radius:3px;animation:fall 2.8s linear forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<!-- PAGE 1 -->
<section id="page1" class="page active">
  <span class="float f1">💗</span><span class="float f2">🎀</span>
  <span class="float f3">✨</span><span class="float f4">🌷</span><span class="float f5">💖</span>
  <div class="content">
    <div class="name">Mashoora 💗</div>
    <h1>Happy Birthday! 🎂</h1>
    <p>I have a little surprise waiting for you 👀🎁</p>
    <div class="gift" aria-hidden="true">
      <div class="bow"></div><div class="lid"></div><div class="box"></div>
      <div class="ribbon-v"></div><div class="ribbon-h"></div>
    </div>
    <button onclick="goPage2()">Open your surprise 💗</button>
  </div>
</section>

<!-- PAGE 2 -->
<section id="page2" class="page">
  <span class="float f1">💗</span><span class="float f2">✨</span>
  <span class="float f3">🎀</span><span class="float f4">💖</span>
  <div class="content">
    <h2>One last surprise… 👀</h2>
    <p>Scratch the card and see what you won 🫣💗</p>
    <div class="scratch-wrap">
      <div class="card">
        <div class="prize">
          <div class="emoji">🛍️💗</div>
          <strong>FREE SHOPPING!</strong>
          
        </div>
        <canvas id="scratch"></canvas>
      </div>
    </div>
    <p class="hint">✨ Scratch with your finger ✨</p>
    <p class="small">Happy Birthday, my love ❤️</p>
  </div>
  <div class="confetti" id="confetti"></div>
</section>

<script>
const p1=document.getElementById('page1'),p2=document.getElementById('page2');
function goPage2(){p1.classList.remove('active');setTimeout(()=>p2.classList.add('active'),120)}

const canvas=document.getElementById('scratch');
const card=document.querySelector('.card');
const ctx=canvas.getContext('2d');
let drawing=false, revealed=false, lastCheck=0;

function resizeCanvas(){
  const r=card.getBoundingClientRect(), d=window.devicePixelRatio||1;
  canvas.width=r.width*d; canvas.height=r.height*d;
  canvas.style.width=r.width+'px'; canvas.style.height=r.height+'px';
  ctx.setTransform(d,0,0,d,0,0);
  ctx.globalCompositeOperation='source-over';
  const g=ctx.createLinearGradient(0,0,r.width,r.height);
  g.addColorStop(0,'#cfcfcf');g.addColorStop(.5,'#f2f2f2');g.addColorStop(1,'#b9b9b9');
  ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
  ctx.fillStyle='#777';ctx.textAlign='center';ctx.font='bold 22px Arial';
  ctx.fillText('SCRATCH HERE ✨',r.width/2,r.height/2);
  ctx.globalCompositeOperation='destination-out';
}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

function pos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function scratch(e){
  if(!drawing||revealed)return;
  e.preventDefault();
  const p=pos(e);
  ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();
  if(performance.now()-lastCheck>400){lastCheck=performance.now();checkReveal();}
}
canvas.addEventListener('pointerdown',e=>{drawing=true;scratch(e)});
canvas.addEventListener('pointermove',scratch);
window.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{drawing=true;scratch(e)},{passive:false});
canvas.addEventListener('touchmove',scratch,{passive:false});
window.addEventListener('touchend',()=>drawing=false);

function checkReveal(){
  const w=canvas.width,h=canvas.height;
  const data=ctx.getImageData(0,0,w,h).data;let clear=0,total=0;
  for(let i=3;i<data.length;i+=32){total++;if(data[i]<30)clear++}
  if(clear/total>.55){
    revealed=true;ctx.clearRect(0,0,w,h);launchConfetti();
  }
}
function launchConfetti(){
  const box=document.getElementById('confetti');box.style.display='block';
  for(let i=0;i<45;i++){
    const el=document.createElement('i');
    el.textContent='';
    el.style.left=Math.random()*100+'%';
    el.style.top=(-Math.random()*20)+'%';
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    el.style.animationDelay=(Math.random()*.7)+'s';
    el.style.background=`hsl(${Math.random()*360},80%,65%)`;
    box.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}
</script>
</body>
</html>
